{% extends "base.html" %}
{% block title %}Pengaturan{% endblock %}

{% block content %}
<div class="page-header">
    <h2><i class="fas fa-cog"></i> Pengaturan Sistem</h2>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST" action="{{ url_for('settings.update') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            {% for key, value in settings.items() %}
            <div class="mb-3">
                <label class="form-label">{{ key|replace('_', ' ')|title }}</label>
                <input type="text" name="setting_{{ key }}" class="form-control" value="{{ value }}">
            </div>
            {% endfor %}
            <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Simpan Pengaturan</button>
        </form>
    </div>
</div>
{% endblock %}
