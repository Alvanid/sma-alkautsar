{% extends "base.html" %}
{% block title %}Hari Libur{% endblock %}

{% block content %}
<div class="page-header d-flex justify-content-between align-items-center">
    <h2><i class="fas fa-calendar-times"></i> Hari Libur</h2>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addHolidayModal">
        <i class="fas fa-plus"></i> Tambah
    </button>
</div>

<div class="card">
    <div class="card-body">
        <table class="table">
            <thead><tr><th>Nama</th><th>Tanggal</th><th>Tipe</th></tr></thead>
            <tbody>
                {% for h in holidays %}
                <tr>
                    <td>{{ h.name }}</td>
                    <td>{{ h.date.strftime('%d/%m/%Y') }}</td>
                    <td><span class="badge bg-info">{{ h.type|capitalize }}</span></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

<div class="modal fade" id="addHolidayModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form method="POST" action="{{ url_for('settings.add_holiday') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="modal-header">
                    <h5 class="modal-title">Tambah Hari Libur</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Nama</label>
                        <input type="text" name="name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Tanggal</label>
                        <input type="date" name="date" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Tipe</label>
                        <select name="type" class="form-select">
                            <option value="national">Nasional</option>
                            <option value="school">Sekolah</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary">Simpan</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
