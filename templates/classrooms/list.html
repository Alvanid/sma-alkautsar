{% extends "base.html" %}
{% block title %}Data Kelas{% endblock %}

{% block content %}
<div class="page-header d-flex justify-content-between align-items-center">
    <h2><i class="fas fa-door-open"></i> Data Kelas</h2>
    <a href="{{ url_for('admin.add_classroom') }}" class="btn btn-primary">
        <i class="fas fa-plus"></i> Tambah Kelas
    </a>
</div>

<div class="row">
    {% for c in classes %}
    <div class="col-md-4">
        <div class="card">
            <div class="card-body text-center">
                <i class="fas fa-door-open fa-3x text-primary mb-3"></i>
                <h4>{{ c.full_name }}</h4>
                <p class="text-muted">{{ c.students.count() }} Siswa</p>
                <a href="{{ url_for('teacher.class_detail', class_id=c.id) }}" class="btn btn-sm btn-primary">Detail</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
