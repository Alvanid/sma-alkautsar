{% extends "base.html" %}
{% block title %}Scan QR Code{% endblock %}

{% block content %}
<div class="page-header">
    <h2><i class="fas fa-qrcode"></i> Scan QR Code Absensi</h2>
</div>

<div class="row">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h5>Kamera Scanner</h5>
                <div class="mt-2">
                    <label class="form-label">Pilih Sesi:</label>
                    <select id="sessionSelect" class="form-select">
                        {% for s in sessions %}
                        <option value="{{ s.id }}">{{ s.name }} ({{ s.start_time.strftime('%H:%M') }} - {{ s.end_time.strftime('%H:%M') }})</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="card-body">
                <div id="reader" style="width: 100%;"></div>
                <div class="mt-3 text-center">
                    <button class="btn btn-primary" id="startScan">
                        <i class="fas fa-camera"></i> Mulai Scan
                    </button>
                    <button class="btn btn-secondary" id="stopScan" style="display:none;">
                        <i class="fas fa-stop"></i> Stop
                    </button>
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card">
            <div class="card-header"><h5>Riwayat Scan</h5></div>
            <div class="card-body">
                <div id="scanHistory" class="scan-history">
                    <p class="text-muted text-center">Belum ada scan</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://unpkg.com/html5-qrcode"></script>
<script>
let html5QrCode;
let scanning = false;

document.getElementById('startScan').addEventListener('click', function() {
    html5QrCode = new Html5Qrcode("reader");
    const sessionId = document.getElementById('sessionSelect').value;
    
    html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        onScanSuccess,
        onScanFailure
    ).then(() => {
        scanning = true;
        document.getElementById('startScan').style.display = 'none';
        document.getElementById('stopScan').style.display = 'inline-block';
    });
});

document.getElementById('stopScan').addEventListener('click', function() {
    if (html5QrCode && scanning) {
        html5QrCode.stop().then(() => {
            html5QrCode.clear();
            scanning = false;
            document.getElementById('startScan').style.display = 'inline-block';
            document.getElementById('stopScan').style.display = 'none';
        });
    }
});

function onScanSuccess(decodedText) {
    const sessionId = document.getElementById('sessionSelect').value;
    const token = decodedText.split(':')[1];
    
    // Ambil CSRF token dari meta tag
    const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');
    
    fetch('{{ url_for("attendance.scan_process") }}', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
            'X-CSRFToken': csrfToken
        },
        body: `token=${token}&session_id=${sessionId}&csrf_token=${csrfToken}`
    })
    .then(res => res.json())
    .then(data => {
        if (data.success) {
            Swal.fire({icon: 'success', title: 'Berhasil!', text: data.message, timer: 2000, showConfirmButton: false});
            addToHistory(data, 'success');
        } else {
            Swal.fire({icon: 'error', title: 'Gagal', text: data.message, timer: 2000});
            addToHistory(data, 'error');
        }
    });
}

function onScanFailure(error) {}

function addToHistory(data, type) {
    const history = document.getElementById('scanHistory');
    if (history.querySelector('p')) history.innerHTML = '';
    const item = document.createElement('div');
    item.className = `scan-item ${type}`;
    item.innerHTML = `<strong>${data.student || '-'}</strong><br><small>${data.status || ''} - ${data.time || ''}</small>`;
    history.insertBefore(item, history.firstChild);
}
</script>
{% endblock %}
