{% extends "base.html" %}
{% block title %}Absensi Manual{% endblock %}

{% block content %}
<div class="page-header">
    <h2><i class="fas fa-edit"></i> Absensi Manual</h2>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Siswa *</label>
                    <select name="student_id" class="form-select" required>
                        {% for s in students %}
                        <option value="{{ s.id }}">{{ s.full_name }} - {{ s.nis }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Sesi *</label>
                    <select name="session_id" class="form-select" required>
                        {% for s in sessions %}
                        <option value="{{ s.id }}">{{ s.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Status *</label>
                    <select name="status" class="form-select" required>
                        <option value="hadir">Hadir</option>
                        <option value="terlambat">Terlambat</option>
                        <option value="izin">Izin</option>
                        <option value="sakit">Sakit</option>
                        <option value="alfa">Alfa</option>
                        <option value="dispensasi">Dispensasi</option>
                    </select>
                </div>
                <div class="col-12 mb-3">
                    <label class="form-label">Catatan</label>
                    <textarea name="notes" class="form-control" rows="2"></textarea>
                </div>
            </div>
            <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Simpan Absensi</button>
        </form>
    </div>
</div>
{% endblock %}
