{% extends "base.html" %}
{% block title %}Laporan{% endblock %}

{% block content %}
<div class="page-header">
    <h2><i class="fas fa-chart-bar"></i> Laporan Absensi</h2>
</div>

<div class="row">
    <div class="col-md-4">
        <div class="card">
            <div class="card-body text-center">
                <i class="fas fa-calendar-day fa-3x text-primary mb-3"></i>
                <h5>Laporan Harian</h5>
                <a href="{{ url_for('reports.daily') }}" class="btn btn-primary">Buka</a>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card">
            <div class="card-body text-center">
                <i class="fas fa-calendar-alt fa-3x text-success mb-3"></i>
                <h5>Laporan Bulanan</h5>
                <a href="{{ url_for('reports.monthly') }}" class="btn btn-success">Buka</a>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card">
            <div class="card-body text-center">
                <i class="fas fa-file-excel fa-3x text-warning mb-3"></i>
                <h5>Export Excel</h5>
                <form method="GET" action="{{ url_for('reports.export_excel') }}">
                    <input type="date" name="from" class="form-control mb-2" value="{{ today }}">
                    <input type="date" name="to" class="form-control mb-2" value="{{ today }}">
                    <button class="btn btn-warning w-100">Download</button>
                </form>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card">
            <div class="card-body text-center">
                <i class="fas fa-file-pdf fa-3x text-danger mb-3"></i>
                <h5>Export PDF</h5>
                <form method="GET" action="{{ url_for('reports.export_pdf') }}">
                    <input type="date" name="from" class="form-control mb-2" value="{{ today }}">
                    <input type="date" name="to" class="form-control mb-2" value="{{ today }}">
                    <button class="btn btn-danger w-100">Download</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
