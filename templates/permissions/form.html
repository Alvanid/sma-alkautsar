{% extends "base.html" %}
{% block title %}Ajukan Izin{% endblock %}

{% block content %}
<div class="page-header">
    <h2><i class="fas fa-file-alt"></i> Ajukan Izin/Sakit</h2>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST" enctype="multipart/form-data">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            {% if current_user.role != 'student' %}
            <div class="mb-3">
                <label class="form-label">Siswa</label>
                <select name="student_id" class="form-select" required>
                    {% for s in students %}
                    <option value="{{ s.id }}">{{ s.full_name }} ({{ s.nis }})</option>
                    {% endfor %}
                </select>
            </div>
            {% endif %}
            <div class="mb-3">
                <label class="form-label">Jenis *</label>
                <select name="type" class="form-select" required>
                    <option value="izin">Izin</option>
                    <option value="sakit">Sakit</option>
                </select>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Tanggal Mulai *</label>
                    <input type="date" name="start_date" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Tanggal Selesai *</label>
                    <input type="date" name="end_date" class="form-control" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Alasan *</label>
                <textarea name="reason" class="form-control" rows="4" required></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Surat/Bukti (PDF/Image)</label>
                <input type="file" name="attachment" class="form-control" accept=".pdf,.jpg,.jpeg,.png">
            </div>
            <button type="submit" class="btn btn-primary"><i class="fas fa-paper-plane"></i> Kirim Pengajuan</button>
            <a href="{{ url_for('permissions.index') }}" class="btn btn-secondary">Batal</a>
        </form>
    </div>
</div>
{% endblock %}
