{% extends "base.html" %}
{% block title %}QR Code - {{ student.full_name }}{% endblock %}

{% block content %}
<div class="page-header">
    <h2><i class="fas fa-qrcode"></i> QR Code Siswa</h2>
</div>

<div class="row">
    <div class="col-md-6 mx-auto">
        <div class="card">
            <div class="card-body text-center">
                <img src="{{ qr_image }}" alt="QR Code" class="img-fluid" style="max-width: 300px;">
                <h4 class="mt-3">{{ student.full_name }}</h4>
                <p class="text-muted">NIS: {{ student.nis }}</p>
                <p class="text-muted">{{ student.classroom.full_name if student.classroom else '-' }}</p>
                <a href="#" onclick="window.print()" class="btn btn-primary">
                    <i class="fas fa-print"></i> Cetak
                </a>
                <a href="{{ url_for('admin.students') }}" class="btn btn-secondary">
                    <i class="fas fa-arrow-left"></i> Kembali
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
